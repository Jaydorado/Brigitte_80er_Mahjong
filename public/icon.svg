<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Brigittes Mahjong: birthday cake, 80. Palette: cream #FFF8EE, gold #D9B26F,
       rose #E89AA8, berry #8E2F4F. Art stays inside r <= ~216 of the centre so the
       maskable variant (90% scale) keeps it inside the 40%-radius safe zone. -->
  <rect width="512" height="512" rx="96" fill="#8E2F4F"/>

  <!-- bottom tier -->
  <rect x="106" y="288" width="300" height="124" rx="10" fill="#FFF8EE"/>
  <path d="M106 288h300v18H106z" fill="#E89AA8"/>
  <g fill="#E89AA8"><circle cx="119.6" cy="306" r="13"/><circle cx="146.9" cy="306" r="13"/><circle cx="174.2" cy="306" r="13"/><circle cx="201.5" cy="306" r="13"/><circle cx="228.7" cy="306" r="13"/><circle cx="256.0" cy="306" r="13"/><circle cx="283.3" cy="306" r="13"/><circle cx="310.5" cy="306" r="13"/><circle cx="337.8" cy="306" r="13"/><circle cx="365.1" cy="306" r="13"/><circle cx="392.4" cy="306" r="13"/></g>

  <!-- "80", drawn as paths so it renders without a font -->
  <g fill="none" stroke="#D9B26F" stroke-width="11">
    <circle cx="222" cy="346" r="17"/>
    <circle cx="222" cy="379" r="20"/>
    <ellipse cx="290" cy="362.5" rx="20" ry="33"/>
  </g>

  <!-- middle tier -->
  <rect x="134" y="208" width="244" height="80" rx="10" fill="#E89AA8"/>
  <path d="M134 208h244v18H134z" fill="#FFF8EE"/>
  <g fill="#FFF8EE"><circle cx="146.2" cy="226" r="12"/><circle cx="170.6" cy="226" r="12"/><circle cx="195.0" cy="226" r="12"/><circle cx="219.4" cy="226" r="12"/><circle cx="243.8" cy="226" r="12"/><circle cx="268.2" cy="226" r="12"/><circle cx="292.6" cy="226" r="12"/><circle cx="317.0" cy="226" r="12"/><circle cx="341.4" cy="226" r="12"/><circle cx="365.8" cy="226" r="12"/></g>

  <!-- top tier -->
  <rect x="168" y="130" width="176" height="78" rx="10" fill="#FFF8EE"/>
  <path d="M168 130h176v16H168z" fill="#E89AA8"/>
  <g fill="#E89AA8"><circle cx="179.0" cy="146" r="11"/><circle cx="201.0" cy="146" r="11"/><circle cx="223.0" cy="146" r="11"/><circle cx="245.0" cy="146" r="11"/><circle cx="267.0" cy="146" r="11"/><circle cx="289.0" cy="146" r="11"/><circle cx="311.0" cy="146" r="11"/><circle cx="333.0" cy="146" r="11"/></g>

  <!-- candles -->
  <g fill="#E89AA8">
    <rect x="210" y="100" width="8" height="34" rx="4"/>
    <rect x="252" y="100" width="8" height="34" rx="4"/>
    <rect x="294" y="100" width="8" height="34" rx="4"/>
  </g>
  <g fill="#D9B26F">
    <path d="M214 85c-5 7-6 12 0 15 6-3 5-8 0-15z"/>
    <path d="M256 85c-5 7-6 12 0 15 6-3 5-8 0-15z"/>
    <path d="M298 85c-5 7-6 12 0 15 6-3 5-8 0-15z"/>
  </g>
</svg>
